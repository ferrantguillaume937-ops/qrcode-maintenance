<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance Report</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #1f2937;
    }

    .container {
      max-width: 520px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    h2 {
      margin-top: 28px;
    }

    .location {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Maintenance Report</h1>

    <p>Report a problem in this area.</p>

    <h2>Location</h2>

    <div id="location" class="location">
      Loading location...
    </div>

    <label for="problem">Problem type</label>

    <select id="problem">
      <option>Maintenance</option>
      <option>Cleaning</option>
      <option>Garden</option>
      <option>Pool</option>
      <option>Laundry</option>
      <option>Car Park</option>
      <option>Other</option>
    </select>

    <label for="description">Describe the problem</label>

    <textarea
      id="description"
      placeholder="Example: The air conditioner is not working."
    ></textarea>

    <button type="button">
      Send Report
    </button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

const building = params.get("building") || "Unknown";
const room = params.get("room") || "Unknown";

document.getElementById("location").textContent =
  `Building ${building} – Room ${room}`;
  </script>

</body>
</html>
